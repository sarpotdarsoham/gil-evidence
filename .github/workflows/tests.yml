name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -S -B run_tests.py
      - run: python -I -S -B tests/model_oracle_v2.py
      - run: python -m pip install .
      - name: Check installed entry point away from source directory
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gil-evidence "$GITHUB_WORKSPACE/examples/after_import.py" --line 4
